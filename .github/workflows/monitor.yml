name: ths-post-monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ths-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore seen-post state
        uses: actions/cache@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run monitor
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: python monitor.py
